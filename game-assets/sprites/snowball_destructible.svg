<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<title>Bola de neve apoiada sobre um pequeno monte de neve derretendo — Mundo 4</title>
<desc>Bola de neve tridimensional branca e azul-gelo, base achatada apoiada em um pequeno monte irregular de neve acumulada e parcialmente derretida; sem sombra projetada.</desc>
<defs>
 <radialGradient id="snow" cx="31%" cy="20%" r="78%">
  <stop offset="0" stop-color="#fff"/><stop offset=".28" stop-color="#fbfeff"/><stop offset=".58" stop-color="#e9f7ff"/><stop offset=".82" stop-color="#c6e4f4"/><stop offset="1" stop-color="#78a9c9"/>
 </radialGradient>
 <radialGradient id="shine" cx="27%" cy="16%" r="70%">
  <stop offset="0" stop-color="#fff" stop-opacity=".98"/><stop offset=".38" stop-color="#fff" stop-opacity=".48"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="lowerShade" x1="0" y1="0" x2=".15" y2="1">
  <stop offset="0" stop-color="#d8f1ff" stop-opacity="0"/><stop offset=".56" stop-color="#82b6d5" stop-opacity=".14"/><stop offset="1" stop-color="#376d94" stop-opacity=".62"/>
 </linearGradient>
 <linearGradient id="melt" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#f5fdff"/><stop offset=".42" stop-color="#d5effb"/><stop offset="1" stop-color="#8bbbd5"/>
 </linearGradient>
 <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#426f91" stop-opacity=".32"/><stop offset="1" stop-color="#426f91" stop-opacity="0"/>
 </linearGradient>
 <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4.5"/></filter>
 <filter id="spark" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="ballClip"><path d="M256 88 C337 88 402 135 426 207 C451 281 428 344 391 379 C360 408 314 414 256 414 C198 414 152 408 121 379 C84 344 61 281 86 207 C110 135 175 88 256 88Z"/></clipPath>
 <pattern id="grain" width="43" height="39" patternUnits="userSpaceOnUse">
  <circle cx="7" cy="8" r="1.6" fill="#fff" opacity=".9"/><circle cx="27" cy="5" r="1.1" fill="#75a9c8" opacity=".35"/>
  <circle cx="37" cy="25" r="1.5" fill="#fff" opacity=".82"/><circle cx="14" cy="32" r="1.1" fill="#6d9fbe" opacity=".34"/>
  <path d="M20 17l3-1" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".75"/>
 </pattern>
</defs>
<!-- Bola principal; o monte de neve será desenhado depois dela, em primeiro plano. -->
<!-- Silhueta compactada e discretamente achatada na base -->
<path d="M256 88 C337 88 402 135 426 207 C451 281 428 344 391 379 C360 408 314 414 256 414 C198 414 152 408 121 379 C84 344 61 281 86 207 C110 135 175 88 256 88Z" fill="url(#snow)" stroke="#d8effb" stroke-width="3"/>
<g clip-path="url(#ballClip)">
 <path d="M65 86H447V420H65Z" fill="url(#shine)"/>
 <path d="M65 86H447V420H65Z" fill="url(#lowerShade)"/>
 <path d="M65 86H447V420H65Z" fill="url(#grain)" opacity=".72"/>
 <path d="M143 174c23-28 55-41 86-39M300 128c25 8 44 25 57 46M111 261c8 30 20 51 40 68M302 371c28-8 49-25 66-49" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".3"/>
 <path d="M148 321c29 23 61 31 94 27M282 343c25-5 46-17 61-36" fill="none" stroke="#78a9c8" stroke-width="5" stroke-linecap="round" opacity=".2"/>
 <ellipse cx="207" cy="157" rx="72" ry="35" fill="#fff" opacity=".2" transform="rotate(-28 207 157)"/>
</g>
<!-- Pequenas gotas e cristais derretendo no monte de neve -->
<path d="M178 397c-2 5-3 8-1 11 2 2 5 1 6-2 1-3-2-6-5-9Z" fill="#dff7ff" stroke="#b8e6fa" stroke-width="1.5" opacity=".95"/>
<path d="M329 396c-2 4-3 7-1 9 2 2 5 1 6-2 1-3-2-5-5-7Z" fill="#dff7ff" stroke="#b8e6fa" stroke-width="1.5" opacity=".9"/>
<path d="M250 405c-1.5 3-2 5-.5 7 1.5 1.5 4 .5 4.5-1.5.5-2-2-4-4-5.5Z" fill="#f4fdff" opacity=".9"/>
<ellipse cx="211" cy="151" rx="47" ry="22" fill="#fff" opacity=".38" transform="rotate(-32 211 151)"/>
<path d="M145 207c12-48 47-83 91-96" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".65"/>
<path d="M358 303c-15 43-49 71-91 82" fill="none" stroke="#6f9fbd" stroke-width="5" stroke-linecap="round" opacity=".22"/>
<!-- Cristais e pontos de brilho pequenos -->
<g fill="#fff" filter="url(#spark)">
 <path d="M115 230l3-8 3 8 8 3-8 3-3 8-3-8-8-3Z" opacity=".9"/>
 <path d="M382 237l2.5-6 2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5Z" opacity=".88"/>
 <path d="M178 361l2-5 2 5 5 2-5 2-2 5-2-5-5-2Z" opacity=".85"/>
 <circle cx="337" cy="128" r="2.6"/><circle cx="300" cy="186" r="1.8"/><circle cx="151" cy="286" r="1.7"/>
</g>

<!-- Monte de neve em PRIMEIRO PLANO: cobre a borda inferior da bola e preenche o centro, sem sombra projetada. -->
<path d="M78 414 C82 404 91 400 103 405 C108 393 121 388 134 399 C144 388 158 389 169 401 C182 394 197 398 205 408 C219 401 232 405 242 411 C253 403 266 403 278 411 C289 404 304 402 316 408 C326 397 340 394 351 402 C362 389 378 390 388 402 C401 394 416 400 420 411 C432 407 442 414 445 424 L445 441 C416 445 391 439 365 442 C337 446 310 439 282 443 C252 447 225 440 198 443 C168 446 142 440 116 443 C99 444 86 439 78 434Z" fill="#dff5ff" stroke="#a9d9f0" stroke-width="3"/>
<path d="M86 418 C98 407 108 407 119 414 C128 403 141 400 151 410 C163 400 176 402 185 412 C197 405 210 407 219 416 C232 409 244 411 254 419 C267 410 280 411 291 419 C303 410 317 410 327 418 C339 407 352 405 363 414 C375 403 389 404 399 414 C410 407 423 411 435 421" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".96"/>
<path d="M94 427 C126 419 151 428 181 425 C210 422 230 430 257 427 C286 423 311 431 339 426 C371 421 398 430 430 425 L426 438 C398 442 373 435 345 440 C314 445 288 437 258 442 C226 446 204 437 177 441 C145 445 119 436 96 438Z" fill="#b8e7fa" opacity=".94" stroke="#eafaff" stroke-width="2"/>
<path d="M111 420c9-6 17-5 24 1m24-5c8-6 16-5 22 2m35-1c8-5 16-4 22 2m44-1c9-6 17-5 24 2m29-4c8-6 17-5 23 2m30-4c8-5 15-4 21 2" fill="none" stroke="#8fc9e7" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
<!-- Pequenos cristais e flocos na neve frontal. -->
<g filter="url(#spark)">
 <path d="M137 410l2.5-6 2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5Z" fill="#fff"/>
 <path d="M207 426l2-5 2 5 5 2-5 2-2 5-2-5-5-2Z" fill="#fff"/>
 <path d="M303 416l2.5-6 2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5Z" fill="#fff"/>
 <path d="M379 424l2-5 2 5 5 2-5 2-2 5-2-5-5-2Z" fill="#fff"/>
 <circle cx="170" cy="430" r="2.4" fill="#fff"/><circle cx="264" cy="435" r="2.8" fill="#fff"/><circle cx="350" cy="431" r="2.2" fill="#fff"/>
</g>


</svg>