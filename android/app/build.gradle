plugins {
    id "com.android.application"
}

android {
    namespace "com.bombardeiro.game"
    compileSdk 35

    defaultConfig {
        applicationId "com.bombardeiro.game.storagepilot"
        minSdk 23
        targetSdk 28
        // O workflow define um código crescente para cada compilação.
        versionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "2").toInteger()
        versionName = (System.getenv("ANDROID_VERSION_NAME") ?: "1.0.0")
    }

    signingConfigs {
        release {
            storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "release-keystore.jks")
            storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: ""
            keyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: ""
            keyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
