name: Gerar trilha do deserto do Bombardeiro

on:
  push:
    branches: [main]
    paths:
      - "game-assets/music/gerar_trilha_deserto.py"
      - ".github/workflows/gerar-trilha-deserto.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-trilha-deserto:
    name: Compor e publicar música do deserto
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Gerar trilha original em WAV estéreo
        run: python3 game-assets/music/gerar_trilha_deserto.py
      - name: Validar arquivo de áudio
        run: |
          python3 - <<'PY'
          import wave
          from pathlib import Path
          p = Path("game-assets/music/bombardeiro_deserto_32bit.wav")
          assert p.is_file() and p.stat().st_size > 1_000_000
          with wave.open(str(p), "rb") as w:
              assert w.getnchannels() == 2
              assert w.getsampwidth() == 2
              assert w.getframerate() == 44100
              assert w.getnframes() / w.getframerate() > 70
              print("WAV do deserto validado:", w.getnframes()/w.getframerate(), "segundos")
          PY
      - name: Salvar trilha no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-assets/music/bombardeiro_deserto_32bit.wav
          if git diff --cached --quiet; then
            echo "A trilha já está atualizada."
          else
            git commit -m "Adiciona trilha original do deserto"
            git push origin HEAD:main
          fi
      - name: Disponibilizar WAV para download
        uses: actions/upload-artifact@v4
        with:
          name: Trilha-Bombardeiro-Deserto-32bit
          path: game-assets/music/bombardeiro_deserto_32bit.wav
          if-no-files-found: error
          retention-days: 30
