name: Gerar APK do Bombardeiro

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "bombardeirojogo.html"
      - "bombericon.jpg"
      - "game-assets/**"
      - "bomba explosão.mp3"
      - "moeda.mp3"
      - "botões.mp3"
      - "tela floresta.jpg"
      - "android/**"
      - ".github/workflows/gerar-apk.yml"

permissions:
  contents: write

jobs:
  build:
    name: Compilar aplicativo Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6
      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
      - name: Instalar plataforma Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar ferramenta de recorte do ícone
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg
      - name: Converter e suavizar os áudios da explosão, moeda e botões
        run: |
          mkdir -p game-assets/audio
          ffmpeg -hide_banner -loglevel error -y \
            -i "bomba explosão.mp3" \
            -af "volume=0.85,alimiter=limit=0.95" \
            -ar 44100 -ac 2 -c:a pcm_s16le \
            game-assets/audio/explosion.wav
          ffmpeg -hide_banner -loglevel error -y \
            -i "moeda.mp3" \
            -af "volume=0.85,alimiter=limit=0.95" \
            -ar 44100 -ac 2 -c:a pcm_s16le \
            game-assets/audio/coin_pickup.wav
          ffmpeg -hide_banner -loglevel error -y \
            -i "botões.mp3" \
            -af "volume=0.85,alimiter=limit=0.95" \
            -ar 44100 -ac 2 -c:a pcm_s16le \
            game-assets/audio/ui_click.wav
          test -s game-assets/audio/explosion.wav
          test -s game-assets/audio/coin_pickup.wav
          test -s game-assets/audio/ui_click.wav
          echo "Áudios convertidos para WAV PCM 16-bit, 44.1 kHz, estéreo."
      - name: Salvar WAVs convertidos no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-assets/audio/explosion.wav game-assets/audio/coin_pickup.wav game-assets/audio/ui_click.wav
          if git diff --cached --quiet; then
            echo "Os WAVs já estão atualizados; nenhum commit adicional necessário."
          else
            git commit -m "Atualiza áudios de explosão e moeda para WAV suavizados"
            git push origin HEAD:main
          fi
      - name: Gerar ícones oficiais do aplicativo
        run: bash android/generate-app-icon.sh
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Montar pacote externo do jogo
        run: |
          GAME_ASSETS="android/app/src/main/assets/game"
          mkdir -p "$GAME_ASSETS"
          cp bombardeirojogo.html "$GAME_ASSETS/bombardeirojogo.html"
          # Ajusta a largura útil do logotipo para que o brilho e a inclinação não sejam cortados nas laterais.
          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path("android/app/src/main/assets/game/bombardeirojogo.html")
          s = p.read_text(encoding="utf-8")

          # Localiza exclusivamente a regra .gameLogo, sem depender de espaços ou quebras de linha.
          selector = re.search(r"\.gameLogo\\s*\\{", s)
          if not selector:
              raise SystemExit("Seletor .gameLogo não encontrado no HTML empacotado.")

          start = selector.end()
          end = s.find("}", start)
          if end < 0:
              raise SystemExit("Bloco CSS .gameLogo está incompleto; pacote não será alterado.")

          block = s[start:end]
          width_rule = re.compile(r"(\\bwidth\\s*:\\s*)[^;]+;", re.IGNORECASE)
          if width_rule.search(block):
              block, count = width_rule.subn(r"\\1min(88vw,700px);", block, count=1)
          else:
              block += "\\n width:min(88vw,700px);\\n"
              count = 1

          if count != 1 or "min(88vw,700px)" not in block:
              raise SystemExit("Não foi possível ajustar a largura dentro de .gameLogo.")

          s = s[:start] + block + s[end:]
          p.write_text(s, encoding="utf-8")
          print("Logotipo ajustado dentro de .gameLogo: 88vw/700px; imagem, bombinha, brilho e animação preservados.")
          PY
          mkdir -p "$GAME_ASSETS/game-assets"
          cp -R game-assets/. "$GAME_ASSETS/game-assets/"
          cp "tela floresta.jpg" "$GAME_ASSETS/game-assets/images/forest-selection-background.jpg"
          test -s "$GAME_ASSETS/game-assets/images/forest-selection-background.jpg"
          cd "$GAME_ASSETS"
          find . -type f ! -name "assets-manifest.sha256" -print0 | sort -z | while IFS= read -r -d '' file; do sha256sum "${file#./}"; done > assets-manifest.sha256
          test -s bombardeirojogo.html
          test -s game-assets/audio/explosion.wav
          test -s game-assets/audio/coin_pickup.wav
          test -s game-assets/audio/ui_click.wav
          test -s assets-manifest.sha256
          echo "Arquivos no pacote: $(wc -l < assets-manifest.sha256)"
          du -sh .
      - name: Gerar APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Bombardeiro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

# Game resources are packaged separately and synchronized into app-private storage on first launch.
