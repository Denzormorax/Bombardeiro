name: Gerar APK do Bombardeiro

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "bombardeirojogo.html"
      - "tests/**"
      - "bombericon.jpg"
      - "Icone do jogo.png"
      - "Novo Icone do jogo.png"
      - "game-assets/**"
      - "botoes-mundos/**"
      - "logo-bombardeiro-transparente.png"
      - "bomba explosão.mp3"
      - "moeda.mp3"
      - "botões.mp3"
      - "tela floresta.jpg"
      - "android/**"
      - ".github/workflows/gerar-apk.yml"

permissions:
  contents: write

jobs:
  build:
    name: Compilar aplicativo Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
      - name: Instalar plataforma Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar ferramentas somente quando necessário
        run: |
          set -euo pipefail

          NEEDS_AUDIO_CONVERSION=false
          if [[ ! -s game-assets/audio/explosion.wav || ! -s game-assets/audio/coin_pickup.wav || ! -s game-assets/audio/ui_click.wav ]]; then
            NEEDS_AUDIO_CONVERSION=true
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]] && ! git diff --quiet HEAD^ HEAD -- "bomba explosão.mp3" "moeda.mp3" "botões.mp3"; then
            NEEDS_AUDIO_CONVERSION=true
          fi

          PACKAGES=()
          if ! command -v magick >/dev/null 2>&1; then
            PACKAGES+=(imagemagick)
          fi
          if [[ "$NEEDS_AUDIO_CONVERSION" == "true" ]] && ! command -v ffmpeg >/dev/null 2>&1; then
            PACKAGES+=(ffmpeg)
          fi

          if (( ${#PACKAGES[@]} > 0 )); then
            echo "Instalando somente ferramentas ausentes: ${PACKAGES[*]}"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${PACKAGES[@]}"
          else
            echo "ImageMagick já está disponível e os WAVs existentes continuam válidos."
          fi

          if [[ "$NEEDS_AUDIO_CONVERSION" == "true" ]]; then
            command -v ffmpeg >/dev/null 2>&1 || { echo "FFmpeg não está disponível para converter os áudios." >&2; exit 1; }
            echo "NEEDS_AUDIO_CONVERSION=true" >> "$GITHUB_ENV"
          else
            echo "NEEDS_AUDIO_CONVERSION=false" >> "$GITHUB_ENV"
          fi
      - name: Converter e suavizar os áudios da explosão, moeda e botões
        if: env.NEEDS_AUDIO_CONVERSION == 'true'
        run: |
          mkdir -p game-assets/audio
          ffmpeg -hide_banner -loglevel error -y \
            -i "bomba explosão.mp3" \
            -af "volume=0.85,alimiter=limit=0.95" \
            -ar 44100 -ac 2 -c:a pcm_s16le \
            game-assets/audio/explosion.wav
          ffmpeg -hide_banner -loglevel error -y \
            -i "moeda.mp3" \
            -af "volume=0.85,alimiter=limit=0.95" \
            -ar 44100 -ac 2 -c:a pcm_s16le \
            game-assets/audio/coin_pickup.wav
          ffmpeg -hide_banner -loglevel error -y \
            -i "botões.mp3" \
            -af "volume=0.85,alimiter=limit=0.95" \
            -ar 44100 -ac 2 -c:a pcm_s16le \
            game-assets/audio/ui_click.wav
          test -s game-assets/audio/explosion.wav
          test -s game-assets/audio/coin_pickup.wav
          test -s game-assets/audio/ui_click.wav
          echo "Áudios convertidos para WAV PCM 16-bit, 44.1 kHz, estéreo."
      - name: Salvar WAVs convertidos no repositório
        if: env.NEEDS_AUDIO_CONVERSION == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-assets/audio/explosion.wav game-assets/audio/coin_pickup.wav game-assets/audio/ui_click.wav
          if git diff --cached --quiet; then
            echo "Os WAVs já estão atualizados; nenhum commit adicional necessário."
          else
            git commit -m "Atualiza áudios de explosão e moeda para WAV suavizados"
            git push origin HEAD:main
          fi
      - name: Gerar ícones oficiais do aplicativo
        run: bash android/generate-app-icon.sh
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Montar pacote externo do jogo
        run: |
          GAME_ASSETS="android/app/src/main/assets/game"
          mkdir -p "$GAME_ASSETS"
          cp bombardeirojogo.html "$GAME_ASSETS/bombardeirojogo.html"
          cp logo-bombardeiro-transparente.png "$GAME_ASSETS/logo-bombardeiro-transparente.png"
          # Corrige a exibição do logotipo usando a proporção real da imagem original.
          # A imagem JPEG inteira é preservada; nenhum pixel é recortado nem removido.
          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path

          p = Path("android/app/src/main/assets/game/bombardeirojogo.html")
          s = p.read_text(encoding="utf-8")
          logo_path = Path("logo-bombardeiro-transparente.png")
          logo_bytes = logo_path.read_bytes()
          if not logo_bytes.startswith(bytes([137,80,78,71,13,10,26,10])):
              raise SystemExit("O novo logotipo não é um PNG válido.")
          logo_b64 = base64.b64encode(logo_bytes).decode("ascii")
          s, logo_replaced = re.subn(
              r'(id="bombardeiroLogoImage"\s+src=")data:image/jpeg;base64,[^"]+',
              lambda match: match.group(1) + "data:image/png;base64," + logo_b64,
              s,
              count=1
          )
          if logo_replaced != 1:
              raise SystemExit("A imagem JPEG antiga do logotipo não foi localizada para substituição.")

          # Substitui somente o primeiro bloco estrutural .gameLogo.
          selector = re.search(r"\.gameLogo\s*\{", s)
          if not selector:
              raise SystemExit("Seletor estrutural .gameLogo não encontrado.")

          start = selector.start()
          open_brace = selector.end() - 1
          depth = 1
          pos = open_brace + 1
          while pos < len(s) and depth:
              if s[pos] == "{":
                  depth += 1
              elif s[pos] == "}":
                  depth -= 1
              pos += 1
          if depth:
              raise SystemExit("Bloco CSS .gameLogo incompleto.")

          logo_css = """.gameLogo{
           width:min(90vw,720px);
           aspect-ratio:3044/988;
           height:auto;
           margin:0 auto 10px;
           top:-6px;
           overflow:visible;
           position:relative;
           isolation:isolate;
           background:transparent;
           transform-origin:50% 50%;
           animation:logoSeesaw 4.8s ease-in-out infinite;
          }
          .gameLogo img{
           display:block;
           position:absolute;
           inset:0;
           width:100%;
           height:100%;
           max-width:none;
           object-fit:contain;
           transform:none;
           filter:drop-shadow(0 0 3px rgba(55,195,255,.98)) drop-shadow(0 0 7px rgba(245,92,220,.86)) drop-shadow(0 0 13px rgba(139,75,255,.72));
           user-select:none;
           -webkit-user-drag:none;
           pointer-events:none;
          }"""
          s = s[:start] + logo_css + s[pos:]

          # Desativa o script antigo que cortava a imagem em 57,5% e apagava pixels azuis.
          crop_script = re.compile(
              r"<script>\s*/\* Recorta o logotipo original.*?</script>",
              re.DOTALL
          )
          s, removed = crop_script.subn(
              "<script>/* Logotipo integral: sem recorte nem remoção automática de fundo. */</script>",
              s,
              count=1
          )
          if removed != 1:
              raise SystemExit("Script antigo de recorte não localizado; pacote não será alterado.")

          if "aspect-ratio:3044/988" not in s or "object-fit:contain" not in s:
              raise SystemExit("Validação de proporção/exibição integral falhou.")
          if "Recorta o logotipo original" in s:
              raise SystemExit("O script antigo de recorte ainda está presente.")
          if 'id="bombardeiroLogoImage" src="data:image/png;base64,' not in s:
              raise SystemExit("Novo PNG transparente não foi incorporado.")
          if 'data:image/jpeg;base64,' in s:
              raise SystemExit("A imagem JPEG antiga ainda está incorporada.")

          responsive_css = """<style>
          /* Menu compacto para celulares em modo paisagem ou telas baixas. */
          @media (max-height:600px) {
            #menuContent {
              inset:44px 10px 8px !important;
              justify-content:center !important;
              gap:0 !important;
            }
            #menuContent .gameLogo {
              width:min(90vw,720px,92vh) !important;
              margin:0 auto 4px !important;
              flex:0 0 auto !important;
            }
            #menuContent .mascotFlight {
              zoom:.72;
              height:80px;
              margin:4px auto 2px;
              flex:0 0 80px;
            }
            #menuContent .menuButtons {
              margin-top:6px;
              flex:0 0 auto;
            }
            #menuContent .menuButtons button {
              min-height:44px;
            }
            #menuContent .menuFooter {
              margin-top:6px;
              flex:0 0 auto;
            }
          }
          </style>"""
          if "</head>" not in s:
              raise SystemExit("Não foi possível inserir o ajuste responsivo do menu.")
          s = s.replace("</head>", responsive_css + "\\n</head>", 1)

          # Transição segura da abertura: primeiro revela o menu e só depois remove o splash.
          # Se a função do menu falhar, mantém a abertura visível e mostra o diagnóstico em vez de tela branca.
          old_transition = ' setTimeout(()=>{splash.remove();showMenuScreen("main")},9000);'
          new_transition = ''' setTimeout(()=>{
           try{
            showMenuScreen("main");
            requestAnimationFrame(()=>{if(splash && splash.isConnected)splash.remove()});
           }catch(error){
            if(window.__bombardeiroShowRuntimeError)window.__bombardeiroShowRuntimeError(error && error.stack ? error.stack : error,"Transição da abertura para o menu");
            else console.error("Falha ao abrir menu principal:",error);
           }
          },9000);'''
          if old_transition not in s:
              raise SystemExit("Transição original da abertura não encontrada; compilação cancelada para evitar alteração incorreta.")
          s = s.replace(old_transition, new_transition, 1)

          p.write_text(s, encoding="utf-8")
          print("Logo PNG transparente incorporado; halo estático no contorno, sem animação sobre o interior, e efeito gangorra preservado.")
          PY
          mkdir -p "$GAME_ASSETS/game-assets"
          cp -R game-assets/. "$GAME_ASSETS/game-assets/"
          mkdir -p "$GAME_ASSETS/botoes-mundos"
          cp -R botoes-mundos/. "$GAME_ASSETS/botoes-mundos/"
          for image in \
            cutout_1795789029270.png \
            cutout_1795789063374.png \
            cutout_1795789104053.png \
            cutout_1795789134810.png \
            cutout_1795789184975.png \
            cutout_1795789260946.png; do
            test -s "$GAME_ASSETS/botoes-mundos/$image"
          done
          cp "tela floresta.jpg" "$GAME_ASSETS/game-assets/images/forest-selection-background.jpg"
          cp "Mapa deserto.jpg" "$GAME_ASSETS/Mapa deserto.jpg"
          test -s "$GAME_ASSETS/Mapa deserto.jpg"
          test -s "$GAME_ASSETS/game-assets/images/forest-selection-background.jpg"
          cd "$GAME_ASSETS"
          find . -type f ! -name "assets-manifest.sha256" -print0 | sort -z | while IFS= read -r -d '' file; do sha256sum "${file#./}"; done > assets-manifest.sha256
          test -s bombardeirojogo.html
          test -s game-assets/audio/explosion.wav
          test -s game-assets/audio/coin_pickup.wav
          test -s game-assets/audio/ui_click.wav
          test -s assets-manifest.sha256
          echo "Arquivos no pacote: $(wc -l < assets-manifest.sha256)"
          du -sh .
      - name: Validar sintaxe e testes isolados do jogo
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          html_path = Path("android/app/src/main/assets/game/bombardeirojogo.html")
          html = html_path.read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script\s*>", html, flags=re.IGNORECASE | re.DOTALL)
          inline_scripts = [script for script in scripts if script.strip()]
          if not inline_scripts:
              raise SystemExit("Nenhum script JavaScript inline foi encontrado no HTML do jogo.")
          for index, script in enumerate(inline_scripts, 1):
              check_file = Path(f"/tmp/bombardeiro-inline-{index}.js")
              check_file.write_text(script, encoding="utf-8")
              subprocess.run(["node", "--check", str(check_file)], check=True)
          print(f"Sintaxe inline válida: {len(inline_scripts)} scripts verificados.")
          PY
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find game-assets tests -type f -name '*.js' -print0)
          echo "Sintaxe dos módulos e testes JavaScript válida."
          node --test tests/*.test.js
      - name: Preparar assinatura permanente
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/bombardeiro-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          mkdir -p "$RUNNER_TEMP/signature-check"
          printf 'Bombardeiro signature validation\n' > "$RUNNER_TEMP/signature-check/check.txt"
          jar --create --file "$RUNNER_TEMP/signature-check.jar" -C "$RUNNER_TEMP/signature-check" .
          jarsigner -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" -signedjar "$RUNNER_TEMP/signature-check-signed.jar" "$RUNNER_TEMP/signature-check.jar" "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Keystore, alias e senhas validados com sucesso."
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Chave de assinatura carregada com segurança."

      - name: Gerar APK release assinado
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace

      - name: Verificar assinatura do APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Disponibilizar APK assinado
        uses: actions/upload-artifact@v4
        with:
          name: Bombardeiro-APK-Release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar versão para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Bombardeiro 1.0.${{ github.run_number }}
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

# Game resources are packaged separately and synchronized into app-private storage on first launch.
