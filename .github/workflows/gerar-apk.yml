name: Gerar APK do Bombardeiro

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "bombardeirojogo.html"
      - "audio/**"
      - "android/**"
      - ".github/workflows/gerar-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Compilar aplicativo Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar plataforma Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Colocar o HTML completo dentro do aplicativo
        run: |
          mkdir -p android/app/src/main/assets
          cp bombardeirojogo.html android/app/src/main/assets/bombardeirojogo.html
          test -s android/app/src/main/assets/bombardeirojogo.html
          mkdir -p android/app/src/main/assets/audio
          cp -R audio/. android/app/src/main/assets/audio/
          test -s android/app/src/main/assets/audio/explosion.ogg
          test -s android/app/src/main/assets/audio/coin_pickup.ogg

      - name: Gerar APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Bombardeiro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
