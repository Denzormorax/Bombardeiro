<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="640" viewBox="0 0 320 320">
<title>Bombardeiro — bloco destrutível do Deserto: duna com cascata de areia</title>
<desc>Textura conceitual detalhada de uma pequena duna dourada. Uma cortina de areia amarela e laranja escorre do alto da duna como uma cachoeira de poeira, com grãos em movimento. Prévia visual para aprovação antes da integração ao jogo.</desc>
<defs>
 <linearGradient id="tile" x2="0" y2="1"><stop stop-color="#57351f"/><stop offset=".22" stop-color="#8b5129"/><stop offset="1" stop-color="#3d281e"/></linearGradient>
 <linearGradient id="sand" x1=".08" y1=".08" x2=".82" y2=".94"><stop stop-color="#fff0a0"/><stop offset=".24" stop-color="#ffd45c"/><stop offset=".58" stop-color="#f4a52f"/><stop offset=".82" stop-color="#d87525"/><stop offset="1" stop-color="#9c4b22"/></linearGradient>
 <linearGradient id="fall" x1="0" x2="1" y1="0" y2=".12"><stop stop-color="#ffed91"/><stop offset=".22" stop-color="#ffcf4e"/><stop offset=".56" stop-color="#f5a12c"/><stop offset=".82" stop-color="#df7624"/><stop offset="1" stop-color="#a94d20"/></linearGradient>
 <linearGradient id="shadow" x2="0" y2="1"><stop stop-color="#a95d25" stop-opacity="0"/><stop offset="1" stop-color="#63351f" stop-opacity=".8"/></linearGradient>
 <radialGradient id="shine" cx=".28" cy=".16" r=".85"><stop stop-color="#fff8c8" stop-opacity=".9"/><stop offset=".38" stop-color="#ffe07a" stop-opacity=".35"/><stop offset="1" stop-color="#ffb42f" stop-opacity="0"/></radialGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
 <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5"/></filter>
 <clipPath id="inside"><rect x="10" y="10" width="300" height="300" rx="20"/></clipPath>
 <clipPath id="waterfall"><path d="M112 104 Q132 92 153 99 Q177 92 202 105 L215 263 Q192 278 162 274 Q132 278 105 261Z"/></clipPath>
</defs>
<g clip-path="url(#inside)">
 <rect width="320" height="320" fill="url(#tile)"/>
 <path d="M0 40 Q48 22 94 39 T190 34 T320 28 V320 H0Z" fill="#a86b36" opacity=".22"/>
 <path d="M0 284 Q65 267 118 281 T230 278 T320 270 V320 H0Z" fill="#2b211b" opacity=".55"/>
 <ellipse cx="160" cy="164" rx="115" ry="120" fill="#ffb536" opacity=".3" filter="url(#glow)"/>
 <!-- base shadow and rounded dune silhouette -->
 <path d="M28 204 Q45 158 80 130 Q108 106 143 96 Q175 85 211 103 Q252 123 282 174 Q298 201 299 241 Q267 270 221 282 Q165 298 105 281 Q55 266 25 235Z" fill="#6f3d22" opacity=".9"/>
 <path d="M25 198 Q43 153 80 123 Q112 96 151 91 Q188 88 218 111 Q260 141 291 199 Q273 220 246 235 Q215 250 183 246 Q142 239 111 251 Q67 265 30 234Z" fill="url(#sand)" stroke="#f7c45a" stroke-width="3"/>
 <path d="M32 194 Q62 137 111 111 Q151 88 188 103 Q217 114 242 147 Q206 128 177 133 Q139 138 112 164 Q78 192 32 194Z" fill="#fff0a0" opacity=".38"/>
 <path d="M44 204 Q82 179 111 151 Q145 120 180 124 Q209 126 239 162" fill="none" stroke="#fff4bb" stroke-width="5" opacity=".55" stroke-linecap="round"/>
 <path d="M30 222 Q78 246 116 226 Q150 209 181 219 Q225 234 285 204" fill="none" stroke="#bd6928" stroke-width="8" opacity=".45"/>
 <!-- glowing lip where the sand begins to pour -->
 <path d="M104 127 Q132 103 158 107 Q186 100 211 125" fill="none" stroke="#fff1a0" stroke-width="12" opacity=".65" filter="url(#soft)"/>
 <path d="M108 127 Q134 109 158 112 Q184 107 207 127" fill="none" stroke="#fff8c5" stroke-width="3.5" stroke-linecap="round"/>
 <!-- flowing sand curtain -->
 <g clip-path="url(#waterfall)">
  <path d="M105 99 Q129 91 151 99 Q179 91 208 102 L220 290 L98 290Z" fill="#e98c28" opacity=".4"/>
  <path d="M113 103 C107 143 122 163 116 198 S112 248 123 278 L136 278 C126 239 139 213 132 181 S128 132 140 101Z" fill="url(#fall)"/>
  <path d="M139 99 C132 133 151 164 143 195 S147 244 140 279 L154 279 C164 239 153 215 161 185 S153 132 166 99Z" fill="#ffd75d"/>
  <path d="M162 99 C174 137 158 163 174 196 S165 245 177 280 L190 278 C181 241 198 216 184 184 S194 131 180 99Z" fill="url(#fall)"/>
  <path d="M187 105 C177 139 199 163 190 198 S204 243 197 276 L211 274 C221 235 205 212 216 181 S211 137 207 105Z" fill="#e98a27"/>
  <path d="M124 110 Q132 154 127 194 T133 267" fill="none" stroke="#fff4b1" stroke-width="4" opacity=".72"/>
  <path d="M151 105 Q161 148 155 187 T160 274" fill="none" stroke="#fff7c7" stroke-width="3" opacity=".8"/>
  <path d="M180 106 Q174 151 183 191 T183 270" fill="none" stroke="#ffed9a" stroke-width="3" opacity=".7"/>
  <path d="M202 111 Q193 154 204 194 T201 267" fill="none" stroke="#b95c21" stroke-width="4" opacity=".4"/>
  <path d="M113 110 Q130 143 119 181 T123 272 M143 106 Q153 144 147 177 T150 272 M171 105 Q185 143 174 181 T181 272 M195 109 Q205 144 195 182 T205 268" fill="none" stroke="#fff1a1" stroke-width="1.8" opacity=".85" stroke-dasharray="8 7">
   <animate attributeName="stroke-dashoffset" values="0;30" dur="1.25s" repeatCount="indefinite"/>
  </path>
  <g fill="#ffe17b">
   <circle cx="122" cy="138" r="2.8"><animate attributeName="cy" values="138;276" dur="1.4s" repeatCount="indefinite"/></circle>
   <circle cx="149" cy="121" r="2.2"><animate attributeName="cy" values="121;276" dur="1.1s" repeatCount="indefinite"/></circle>
   <circle cx="174" cy="146" r="2.5"><animate attributeName="cy" values="146;278" dur="1.35s" repeatCount="indefinite"/></circle>
   <circle cx="198" cy="132" r="2.1"><animate attributeName="cy" values="132;276" dur="1.2s" repeatCount="indefinite"/></circle>
  </g>
 </g>
 <!-- sand collecting in a soft mound -->
 <path d="M91 263 Q111 246 131 258 Q154 244 175 258 Q198 246 221 260 Q239 253 252 267 Q220 291 169 291 Q116 291 91 263Z" fill="#d77a28"/>
 <path d="M102 263 Q127 251 145 265 Q170 252 191 266 Q213 256 238 268" fill="none" stroke="#ffe17c" stroke-width="5" stroke-linecap="round" opacity=".9"/>
 <path d="M112 274 Q157 288 204 273" fill="none" stroke="#a95020" stroke-width="4" opacity=".5"/>
 <!-- flying grains, animated down the front -->
 <g fill="#ffe89a">
  <circle cx="94" cy="158" r="2.5"><animate attributeName="cy" values="158;257" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="224" cy="165" r="2"><animate attributeName="cy" values="165;260" dur="1.45s" repeatCount="indefinite"/></circle>
  <circle cx="105" cy="208" r="1.8"><animate attributeName="cy" values="208;272" dur="1.1s" repeatCount="indefinite"/></circle>
  <circle cx="216" cy="211" r="2.4"><animate attributeName="cy" values="211;273" dur="1.3s" repeatCount="indefinite"/></circle>
 </g>
 <g fill="#fff0a8" opacity=".85"><circle cx="70" cy="170" r="2"/><circle cx="247" cy="185" r="2.5"/><circle cx="83" cy="239" r="1.7"/><circle cx="238" cy="239" r="1.8"/></g>
 <!-- fine dune striations and tile highlights -->
 <path d="M43 215 Q71 229 94 215 M225 184 Q250 196 273 188 M54 243 Q82 258 108 246" fill="none" stroke="#ffd46a" stroke-width="2" opacity=".48"/>
 <rect x="10" y="10" width="300" height="300" rx="20" fill="url(#shine)" opacity=".52"/>
 <rect x="10" y="10" width="300" height="300" rx="20" fill="none" stroke="#f9c66a" stroke-width="5" opacity=".7"/>
 <path d="M15 30V15H30 M290 15H305V30 M15 290V305H30 M290 305H305V290" fill="none" stroke="#ffe9a1" stroke-width="3" opacity=".55"/>
</g>
</svg>