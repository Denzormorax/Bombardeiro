  <path d="M0 10 Q-35 -5 -39 -30 Q-13 -37 3 2Z" fill="url(#leaf)" stroke="#285b32" stroke-width="2.5"/>
  <path d="M2 1 Q27 -29 53 -17 Q51 10 7 17Z" fill="url(#leafLight)" stroke="#285b32" stroke-width="2.5"/>
  <path d="M1 -8 Q-5 -38 15 -55 Q37 -35 8 -3Z" fill="url(#leaf)" stroke="#285b32" stroke-width="2.5"/>
  <path d="M-32 -27 Q-13 -14 1 5 M46 -14 Q24 -4 8 12 M16 -48 Q11 -25 5 -8" fill="none" stroke="#e4f8b5" stroke-width="2.8" opacity=".75"/>
 </g>
</defs>
<rect width="768" height="768" fill="url(#base)"/>
