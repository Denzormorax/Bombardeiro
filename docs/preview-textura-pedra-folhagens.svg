</g>
<!-- Deep crevices separating the stacked stones -->
<g fill="none" stroke="#101a14" stroke-width="17" stroke-linecap="round" opacity=".85">
 <path d="M305 310 Q339 292 367 316"/>
 <path d="M350 443 Q386 425 418 450"/>
 <path d="M254 455 Q280 438 303 454"/>
</g>
<!-- Small leafy shoots growing FROM the cracks, not scattered on top -->
<g filter="url(#drop)">
 <use href="#sprout" transform="translate(340 307) rotate(-18) scale(.83)"/>
 <use href="#sprout" transform="translate(384 438) rotate(16) scale(.78)"/>
 <use href="#sprout" transform="translate(294 454) rotate(-28) scale(.68)"/>
 <use href="#sprout" transform="translate(465 292) rotate(24) scale(.72)"/>
 <use href="#sprout" transform="translate(205 435) rotate(-10) scale(.58)"/>
</g>
<!-- Tiny moss patches nestled in crevices -->
<g fill="#548b43" opacity=".9">
 <path d="M321 320q16-17 30-5q-5 15-24 17z M368 451q18-16 31-2q-9 13-27 12z M279 466q14-14 25-4q-5 12-21 12z"/>
</g>
