<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="768" viewBox="0 0 768 768">
<title>Prévia — cinco pedras 3D empilhadas com folhagens nas frestas</title>
<defs>
 <linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#465047"/><stop offset="1" stop-color="#18251f"/></linearGradient>
 <linearGradient id="top1" x1=".15" y1="0" x2=".85" y2="1"><stop stop-color="#d0cbbb"/><stop offset=".22" stop-color="#99998c"/><stop offset=".58" stop-color="#666b62"/><stop offset="1" stop-color="#343e38"/></linearGradient>
 <linearGradient id="top2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c1c0b4"/><stop offset=".3" stop-color="#85877c"/><stop offset=".7" stop-color="#5a625a"/><stop offset="1" stop-color="#303a34"/></linearGradient>
 <linearGradient id="side" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#596159"/><stop offset=".4" stop-color="#343e38"/><stop offset="1" stop-color="#151f1a"/></linearGradient>
 <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d3f49a"/><stop offset=".3" stop-color="#8bc957"/><stop offset=".72" stop-color="#43883b"/><stop offset="1" stop-color="#20512e"/></linearGradient>
 <linearGradient id="leafLight" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e0f5a4"/><stop offset=".5" stop-color="#8dc95b"/><stop offset="1" stop-color="#3b7938"/></linearGradient>
 <filter id="drop" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="13"/><feOffset dy="18"/><feComponentTransfer><feFuncA type="linear" slope=".72"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
 <g id="sprout">
