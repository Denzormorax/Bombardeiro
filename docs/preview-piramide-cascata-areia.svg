<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 320 320">
<title>Bombardeiro — pirâmide dourada 3D em perspectiva superior com cascata de areia</title>
<desc>Sprite isolado e transparente de uma pirâmide quadrangular vista de cima em perspectiva isométrica. Quatro faces triangulares com iluminação e sombras distintas, arestas de profundidade e três correntes animadas de areia descendo pelas faces.</desc>
<defs>
 <linearGradient id="faceBack" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff5bd"/><stop offset=".55" stop-color="#edb64e"/><stop offset="1" stop-color="#bd702c"/></linearGradient>
 <linearGradient id="faceRight" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe28a"/><stop offset=".48" stop-color="#e99a35"/><stop offset="1" stop-color="#9c4e23"/></linearGradient>
 <linearGradient id="faceFront" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f4bd55"/><stop offset=".52" stop-color="#c8792d"/><stop offset="1" stop-color="#79391f"/></linearGradient>
 <linearGradient id="faceLeft" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#fff0a1"/><stop offset=".5" stop-color="#e5a13d"/><stop offset="1" stop-color="#a85b27"/></linearGradient>
 <linearGradient id="sandLight" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffbd2"/><stop offset=".45" stop-color="#ffdc68"/><stop offset="1" stop-color="#e88a2d"/></linearGradient>
 <linearGradient id="sandDark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffeaa0"/><stop offset=".55" stop-color="#f2a43a"/><stop offset="1" stop-color="#b95722"/></linearGradient>
 <radialGradient id="apexGlow"><stop stop-color="#fffde0" stop-opacity=".98"/><stop offset=".4" stop-color="#ffe17a" stop-opacity=".58"/><stop offset="1" stop-color="#ffb52f" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%"><feGaussianBlur stdDeviation="7"/></filter>
 <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5"/></filter>
 <clipPath id="backClip"><path d="M160 35 L160 105 L285 190Z"/></clipPath>
 <clipPath id="rightClip"><path d="M160 35 L285 190 L160 275Z"/></clipPath>
 <clipPath id="frontClip"><path d="M160 35 L160 275 L35 190Z"/></clipPath>
 <clipPath id="leftClip"><path d="M160 35 L35 190 L160 105Z"/></clipPath>
</defs>
<!-- sombra projetada, sem qualquer fundo quadrado -->
<ellipse cx="162" cy="211" rx="137" ry="82" fill="#583019" opacity=".28" filter="url(#shadow)"/>
<!-- base quadrangular em perspectiva: losango e espessura lateral -->
<path d="M160 105 L285 190 L160 294 L35 190Z" fill="#783a20" stroke="#71351d" stroke-width="3" stroke-linejoin="round"/>
<path d="M35 190 L160 275 L160 294 L35 207Z" fill="#a65325"/>
<path d="M160 275 L285 190 L285 209 L160 294Z" fill="#6f351e"/>
<!-- quatro faces da pirâmide, com luz vindo do alto à esquerda -->
<path d="M160 35 L160 105 L285 190Z" fill="url(#faceBack)" stroke="#ffe7a0" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M160 35 L285 190 L160 275Z" fill="url(#faceRight)" stroke="#d17a2c" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M160 35 L160 275 L35 190Z" fill="url(#faceFront)" stroke="#9c5428" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M160 35 L35 190 L160 105Z" fill="url(#faceLeft)" stroke="#fff0ad" stroke-width="2.2" stroke-linejoin="round"/>
<!-- arestas estruturais convergindo no ápice -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
 <path d="M160 35 L160 105 M160 35 L285 190 M160 35 L160 275 M160 35 L35 190" stroke="#fff4bf" stroke-width="3" opacity=".78"/>
 <path d="M160 105 L285 190 L160 275 L35 190Z" stroke="#7e3c20" stroke-width="3" opacity=".72"/>
 <path d="M160 35 L160 275" stroke="#fff4bd" stroke-width="1.5" opacity=".28"/>
</g>
<ellipse cx="160" cy="43" rx="34" ry="30" fill="url(#apexGlow)"/>
<path d="M160 34 L151 53" stroke="#fffde0" stroke-width="4" stroke-linecap="round" opacity=".9" filter="url(#softGlow)"/>
<circle cx="160" cy="35" r="4" fill="#fffde0"/>
<!-- faixas de areia descendo pela face esquerda -->
<g clip-path="url(#leftClip)">
 <path d="M154 44 Q125 83 102 120 T37 190 L57 204 Q105 153 129 112 T166 48Z" fill="url(#sandLight)" opacity=".96"/>
 <path d="M157 49 Q137 88 119 124 T68 194 L83 204 Q126 151 143 112 T168 53Z" fill="#fff0a1" opacity=".68"/>
 <path d="M151 54 Q124 96 103 132 T48 190" fill="none" stroke="#fffbd5" stroke-width="3.5" stroke-linecap="round" opacity=".9"/>
 <path d="M157 63 Q137 103 117 139 T75 190" fill="none" stroke="#fff2b0" stroke-width="2.5" stroke-dasharray="8 7"><animate attributeName="stroke-dashoffset" values="0;30" dur="1.25s" repeatCount="indefinite"/></path>
</g>
<!-- cascata na face direita -->
<g clip-path="url(#rightClip)">
 <path d="M166 44 Q195 84 220 123 T283 190 L263 207 Q214 158 190 115 T154 49Z" fill="url(#sandDark)" opacity=".97"/>
 <path d="M164 51 Q187 92 206 130 T252 198 L235 207 Q190 157 176 116 T151 55Z" fill="#ffdc73" opacity=".72"/>
 <path d="M169 51 Q198 96 222 137 T272 192" fill="none" stroke="#fff0ad" stroke-width="3.5" stroke-linecap="round" opacity=".86"/>
 <path d="M164 64 Q188 105 207 145 T245 198" fill="none" stroke="#fff1b0" stroke-width="2.5" stroke-dasharray="8 7"><animate attributeName="stroke-dashoffset" values="0;30" dur="1.18s" repeatCount="indefinite"/></path>
</g>
<!-- reflexos e linhas de blocos nas faces, reforçando o volume -->
<g fill="none" stroke-linecap="round" opacity=".42">
 <path d="M160 76 L203 104 M160 91 L224 135 M160 108 L244 164" stroke="#fff6c7" stroke-width="2"/>
 <path d="M160 118 L124 145 M160 151 L102 183 M160 188 L79 220" stroke="#f9d27a" stroke-width="2"/>
 <path d="M160 145 L199 173 M160 183 L221 220" stroke="#8e481f" stroke-width="2"/>
</g>
<!-- três correntes animadas: 18 partículas principais -->
<g fill="#fff7c7">
 <g>
  <circle cx="151" cy="52" r="2.1"/><circle cx="140" cy="70" r="1.6"/><circle cx="127" cy="91" r="2"/><circle cx="112" cy="113" r="1.6"/><circle cx="96" cy="136" r="2"/><circle cx="78" cy="158" r="1.6"/>
  <animateTransform attributeName="transform" type="translate" values="0 -12;-5 12;-10 34" dur="1.5s" repeatCount="indefinite"/>
 </g>
 <g fill="#ffe27b">
  <circle cx="166" cy="54" r="1.8"/><circle cx="180" cy="75" r="2"/><circle cx="195" cy="96" r="1.6"/><circle cx="210" cy="119" r="2"/><circle cx="226" cy="143" r="1.6"/><circle cx="245" cy="165" r="2"/>
  <animateTransform attributeName="transform" type="translate" values="0 -20;4 5;9 30" dur="1.38s" begin="-.45s" repeatCount="indefinite"/>
 </g>
 <g fill="#ffc04b">
  <circle cx="158" cy="83" r="1.7"/><circle cx="158" cy="111" r="2"/><circle cx="158" cy="141" r="1.6"/><circle cx="158" cy="171" r="2"/><circle cx="158" cy="201" r="1.6"/><circle cx="158" cy="231" r="2"/>
  <animateTransform attributeName="transform" type="translate" values="0 -18;0 8;0 32" dur="1.62s" begin="-.8s" repeatCount="indefinite"/>
 </g>
</g>
<!-- grãos soltos junto à base, mantendo o sprite isolado -->
<g fill="#ffe9a4" opacity=".92">
 <circle cx="43" cy="205" r="2"/><circle cx="58" cy="222" r="1.5"/><circle cx="82" cy="237" r="1.8"/><circle cx="104" cy="251" r="1.5"/>
 <circle cx="278" cy="205" r="2"/><circle cx="263" cy="224" r="1.5"/><circle cx="239" cy="240" r="1.8"/><circle cx="216" cy="254" r="1.5"/>
</g>
<!-- contorno externo da base -->
<path d="M160 105 L285 190 L160 294 L35 190Z" fill="none" stroke="#ffdf86" stroke-width="2.2" opacity=".74" stroke-linejoin="round"/>
</svg>